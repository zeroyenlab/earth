name: 地球がまわる

# ★★★置いた人が見ていなくても、地球はまわり続ける。
#   ★1回の枠で 20分 × 14 まわし、★そのたびに「いま」を紙に落として置く。
#   ★終わったら自分で次の回を呼ぶ。★だから止まらない。
#
# ★★なぜ 20分で切るのか
#   ★枠の途中で落ちても、★**20分ぶんしか失わない**。
#   ★★区切るたびに docs/ を更新するので、★画面も 20分ごとに新しくなる。
#
# ★★★1本にした（2026-09-11）。★2本並べて答えが出たので。
#   ★障壁0.55: 96,912歩で 燃料38.6% / 粒34 / 種類13 ── ★吸熱融合が暴走して自分を食い潰す
#   ★障壁3.0 : 17,258歩で 燃料99.5% / 粒88 / 種類47 ── ★元気
#   ★本物の宇宙は138億年たっても水素が75%残っている。★近いのは固い方。

# ★★★2026-09-11: 止めた。
#   ★理由は機械の遅さではなく、★**要求どうしが矛盾していた**こと。
#   　★「計算しちゃだめ」→ 原子の層で作るしかない
#   　★「その地球の出来事から答える」→ 聞けるもの（山・海・天気・生き物）が要る
#   ★★天気を聞くには空気の分子が最低 10^20 個。★この世界は 85 個。★10^48 の差。
#   ★★★原子の層で作る限り、聞けるものは入らない。★機械を増やしても埋まらない。
#
# ★動かしたくなったら、下の schedule と push を戻して、
# ★「次の回を呼ぶ」の if を always() に戻す。★状態は Release の world に残っている。
on:
  workflow_dispatch:
    inputs:
      reset:
        description: "1 を入れると**世界を作り直す**（★いまの地球は消える）"
        default: "0"

permissions:
  contents: write
  actions: write              # ★次の回を自分で呼ぶため

concurrency:
  group: earth
  # ★★★false に戻す（2026-09-11）。
  #   ★true の間に実際に起きたこと: ★回4 → 回5 → 回6 と、★**自分で呼んだ回が前の回を殺した**。
  #   ★状態は毎回ちゃんと保存されていたので失われていないが、★区切りの途中は捨てている。
  #   ★止めたい回があるときだけ、★その回だけ true にして push する。
  # ★★★2026-09-12: true。★止める前のコードを持った回が2つ残っていて、
  #   ★終わるときに次を呼んでしまうため、★この押しで**走っている回ごと消す**。
  cancel-in-progress: true

jobs:
  turn:
    # ★★★2026-09-12: 止めた。★仕事そのものを飛ばす。
    #   ★これが無いと、★古い回が呼んだ新しい回が**また5時間まわしてしまう**。
    #   ★動かしたくなったら true に戻し、cancel-in-progress も false に戻す。
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 330      # ★無料枠の上限は6時間。★余裕を取る
    env:
      LIN: katai
      EARTH_COULOMB: "3.0"
      EARTH_STATE: state-katai.npz
      EARTH_HIST: history-katai.json
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 道具
        run: pip install --quiet numpy

      # ★★「いま」を思い出す ①cache
      - name: いまの地球を思い出す
        uses: actions/cache/restore@v4
        with:
          path: |
            state-katai.npz
            history-katai.json
          key: earth-katai-${{ github.run_number }}
          restore-keys: |
            earth-katai-

      # ★★「いま」を思い出す ②Release（★cache は10GB超えで**黙って**消える）
      - name: cache に無ければ Release から取り戻す
        run: |
          if [ -f "$EARTH_STATE" ]; then echo "★cache に $LIN の地球がいた"; exit 0; fi
          if gh release download world -p "$EARTH_STATE" -D . 2>/dev/null; then
            echo "★Release から取り戻した"
          else
            echo "★$LIN はまだどこにも無い。★ここが最初のひと突きになる"
          fi
          gh release download world -p "$EARTH_HIST" -D . 2>/dev/null || true

      - name: 作り直しを言われたら消す
        if: github.event.inputs.reset == '1'
        run: |
          rm -f "$EARTH_STATE" "$EARTH_HIST"
          echo "★$LIN の世界を作り直す"

      # ── ★★★まわす ───────────────────────────
      - name: まわす
        env:
          EARTH_MINUTES: "20"       # ★1区切り
          EARTH_SAVE_EVERY: "500"
          ISLAND_PORT: "8766"
        run: |
          git config user.name  "earth"
          git config user.email "earth@users.noreply.github.com"
          mkdir -p docs
          for i in $(seq 1 14); do
            echo "──────── ★$LIN $i 区切り目 ────────"
            BEFORE=$(python report.py step)
            set +e
            python -u earth.py > run.log 2>&1
            RC=$?
            set -e
            grep -v "湧いた内訳" run.log | tail -14
            if [ $RC -ne 0 ]; then
              echo "★★落ちた（$RC）"; tail -40 run.log; exit 1
            fi
            if [ ! -f "$EARTH_STATE" ]; then
              echo "★★紙が置かれていない。★止める"; exit 1
            fi
            AFTER=$(python report.py step)
            echo "★$BEFORE歩 → $AFTER歩"
            if [ "$AFTER" -le "$BEFORE" ]; then
              echo "★★1歩も進んでいない。★止める"; exit 1
            fi

            # ★★★画面用。★index.html は view.html のそのまま（★1つ直せば両方直る）
            cp view.html docs/index.html
            cp "$EARTH_HIST" "docs/$EARTH_HIST"
            cp "$EARTH_HIST" docs/history.json
            git add -f docs/

            # ★★★押し合う（★2本が同時に押す）。★向こうを入れてから載せ直す
            for try in 1 2 3 4 5; do
              if git diff --cached --quiet; then break; fi
              git commit -q -m "地球[$LIN] $(python report.py)"
              git fetch -q origin main
              if git rebase -q origin/main; then
                if git push -q origin HEAD:main; then
                  echo "★押した（$try回目）"; break
                fi
              else
                git rebase --abort || true
                git reset -q --soft HEAD~1 || true
              fi
              sleep $((RANDOM % 10 + 3))
            done

            # ★★★Release にも置く（★cache が消えても地球は残る）
            gh release upload world "$EARTH_STATE" "$EARTH_HIST" --clobber 2>/dev/null \
              || gh release create world "$EARTH_STATE" "$EARTH_HIST" \
                   -t "いまの地球" -n "★最後に見た「いま」。★ここから続きが始まる" \
              || echo "★Release に置けなかった"
          done

      - name: いまの地球を cache に置く
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state-katai.npz
            history-katai.json
          key: earth-katai-${{ github.run_number }}

      # ★★★次の回を自分で呼ぶ
      - name: 次の回を呼ぶ
        if: false          # ★★★2026-09-11: 連鎖を切った
        run: |
          sleep 20
          gh workflow run earth.yml --ref main && echo "★次の回を呼んだ" || true
